name: Daily editorials and GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # HKT 06:00 主排程；每小時17分補查，當天收錄及發布成功後跳過。
    - cron: '0 22 * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: '收錄新聞及社評並呼叫 DeepSeek（會按用量收費）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: editorial-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run: ${{ steps.refresh_gate.outputs.run }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install reviewed refresh fix
        id: refresh_install
        run: |
          python3 - <<'PYFIX'
          import base64,hashlib,io,json,tarfile,os
          from pathlib import Path
          marker=Path('data/migrations/live-refresh-v1.json')
          if not marker.exists():
              payload=base64.b64decode('')
              assert hashlib.sha256(payload).hexdigest()=='16ae930f26b75efb5dc4b42b0f074f996672501dfcb24171b1ce8dea6f61c9ed'
              with tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as archive:
                  assert all(x.isfile() and not x.name.startswith(('/', '..', '.github/')) for x in archive.getmembers())
                  archive.extractall('.',filter='data')
              marker.parent.mkdir(parents=True,exist_ok=True)
              marker.write_text(json.dumps({'feature':'live-refresh-v1','sha256':'16ae930f26b75efb5dc4b42b0f074f996672501dfcb24171b1ce8dea6f61c9ed'},indent=2)+'\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('installed=true\n')
          PYFIX
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check whether refresh or publication is needed
        id: refresh_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COLLECT_REQUESTED: ${{ inputs.collect || 'false' }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: node scripts/refresh-gate.mjs
      - run: npm ci
        if: steps.refresh_gate.outputs.run == 'true'
      - run: npm test
        if: steps.refresh_gate.outputs.run == 'true'
      - name: Preserve reviewed refresh source
        if: steps.refresh_install.outputs.installed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app/page.tsx app/globals.css lib/use-digest.ts scripts/refresh-gate.mjs tests/refresh-gate.test.ts data/migrations/live-refresh-v1.json
          git commit -m 'Fix automatic refresh, stale date navigation and daily catch-up'
          git push origin HEAD:main
      - name: Collect and summarize
        if: steps.refresh_install.outputs.installed == 'true' || steps.refresh_gate.outputs.collect == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          SOURCE_OVERRIDES_JSON: ${{ secrets.SOURCE_OVERRIDES_JSON || '{}' }}
          MAX_API_REQUESTS: '96'
          LOOKBACK_DAYS: '3'
        run: npm run collect
      - name: Preserve archive
        if: steps.refresh_install.outputs.installed == 'true' || steps.refresh_gate.outputs.collect == 'true'
        env:
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update editorial archive'
            git push origin "HEAD:$REPO_BRANCH"
          fi
      - name: Set Pages path
        if: steps.refresh_gate.outputs.run == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ] || [[ "$REPO_NAME" == *.github.io ]]; then
            echo 'NEXT_PUBLIC_BASE_PATH=' >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi
      - name: Export static website
        if: steps.refresh_gate.outputs.run == 'true'
        env:
          DEMO_MODE: 'false'
        run: npm run build
      - name: Configure Pages
        if: steps.refresh_gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website only
        if: steps.refresh_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    if: needs.build.outputs.run == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
