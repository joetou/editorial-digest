name: Daily editorials and GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # UTC 22:00 = 翌日香港／澳門 06:00；GitHub排程可能延遲。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: '收錄新聞及社評並呼叫 DeepSeek（會按用量收費）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: editorial-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install reviewed news feature
        id: news_update
        run: |
          python3 - <<'PYUPDATE'
          import base64,hashlib,io,json,tarfile
          from pathlib import Path
          marker=Path('data/migrations/news-brief-v2.json')
          if not marker.exists():
              payload=base64.b64decode('')
              assert hashlib.sha256(payload).hexdigest()=='91038f8d7e8ac093039f638f3e49e8211adeee48447d4a7c8c0141fe3b67ae06'
              with tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as archive:
                  assert all(not x.name.startswith(('/', '.github/', '..')) and x.isfile() for x in archive.getmembers())
                  archive.extractall('.',filter='data')
              marker.parent.mkdir(parents=True,exist_ok=True)
              marker.write_text(json.dumps({'feature':'news-brief-v2','sha256':'91038f8d7e8ac093039f638f3e49e8211adeee48447d4a7c8c0141fe3b67ae06'},indent=2)+'\n')
              import os
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('installed=true\n')
          PYUPDATE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Preserve reviewed news source
        if: steps.news_update.outputs.installed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md app/globals.css app/page.tsx lib/archive.ts lib/deepseek.ts lib/extract.ts lib/types.ts lib/use-digest.ts scripts/build-data.ts scripts/collect.ts lib/news.ts tests/news.test.ts data/migrations/news-brief-v2.json
          git commit -m 'Add news categories, event deduplication and concise summaries'
          git push origin HEAD:main
      - name: Collect and summarize
        if: steps.news_update.outputs.installed == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          SOURCE_OVERRIDES_JSON: ${{ secrets.SOURCE_OVERRIDES_JSON || '{}' }}
          MAX_API_REQUESTS: '96'
          LOOKBACK_DAYS: '3'
        run: npm run collect
      - name: Preserve archive
        if: steps.news_update.outputs.installed == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update editorial archive'
            git push origin "HEAD:$REPO_BRANCH"
          fi
      - name: Set Pages path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ] || [[ "$REPO_NAME" == *.github.io ]]; then
            echo 'NEXT_PUBLIC_BASE_PATH=' >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi
      - name: Export static website
        env:
          DEMO_MODE: 'false'
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
