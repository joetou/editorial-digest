name: Daily editorials and GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # UTC 22:00 = 翌日香港／澳門 06:00；GitHub排程可能延遲。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: '收錄社評並呼叫 DeepSeek（會按用量收費）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: editorial-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      # One-time source restoration for the initial browser-based upload.
      # Normal clones already contain these files; this step then does nothing.
      - name: Restore bundled source on first run
        env:
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PYBOOT'
          import pathlib, base64, hashlib, io, tarfile
          if not all(pathlib.Path(p).exists() for p in ['app/page.tsx','lib/deepseek.ts','scripts/collect.ts']):
              payload=base64.b64decode('')
              assert hashlib.sha256(payload).hexdigest()=='d8a7453b3b707dce155dcf3442a762f8712bf977321eff9e9cd9d03253d979ba'
              with tarfile.open(fileobj=io.BytesIO(payload),mode='r:gz') as archive:
                  archive.extractall('.',filter='data')
          PYBOOT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'Initialize complete editorial website source'
            git push origin "HEAD:$REPO_BRANCH"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect and summarize
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          SOURCE_OVERRIDES_JSON: ${{ secrets.SOURCE_OVERRIDES_JSON || '{}' }}
          MAX_API_REQUESTS: '48'
          LOOKBACK_DAYS: '3'
        run: npm run collect
      - name: Preserve archive
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update editorial archive'
            git push origin "HEAD:$REPO_BRANCH"
          fi
      - name: Set Pages path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ] || [[ "$REPO_NAME" == *.github.io ]]; then
            echo 'NEXT_PUBLIC_BASE_PATH=' >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi
      - name: Export static website
        env:
          DEMO_MODE: 'false'
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
